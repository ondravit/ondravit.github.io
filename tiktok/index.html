<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AthleteLab · TikTok login</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; max-width: 640px;
         margin: 0 auto; padding: 48px 20px; line-height: 1.6; background: #0b0f1a; color: #e8ecf4; }
  h1 { font-size: 1.6rem; }
  .code { font-family: ui-monospace, Menlo, monospace; background: #161c2e; border: 1px solid #2a3350;
          border-radius: 10px; padding: 14px; word-break: break-all; font-size: 0.95rem; }
  button { margin-top: 12px; background: #ff7a1a; color: #0b0f1a; border: 0; border-radius: 8px;
           padding: 10px 18px; font-weight: 700; font-size: 1rem; cursor: pointer; }
  p { color: #b7c0d4; }
  .err { color: #ff6b6b; }
</style>
</head>
<body>
  <h1>AthleteLab · TikTok login</h1>
  <div id="out"><p>Waiting for TikTok…</p></div>
<script>
  const q = new URLSearchParams(location.search);
  const out = document.getElementById("out");
  const code = q.get("code");
  if (code) {
    out.innerHTML = '<p>Access granted. Copy this code and paste it into the terminal:</p>' +
      '<div class="code" id="c"></div><button id="b">Copy code</button>';
    document.getElementById("c").textContent = code;
    document.getElementById("b").onclick = async () => {
      try { await navigator.clipboard.writeText(code); document.getElementById("b").textContent = "Copied ✓"; }
      catch (e) { document.getElementById("b").textContent = "Select the code above and copy it"; }
    };
  } else if (q.get("error")) {
    out.innerHTML = '<p class="err"></p>';
    out.firstChild.textContent = "TikTok returned an error: " + q.get("error") + " — " + (q.get("error_description") || "");
  } else {
    out.innerHTML = "<p>This page receives the one-time code after logging in to TikTok from the AthleteLab tool.</p>";
  }
</script>
</body>
</html>
